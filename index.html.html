<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Catat Cepat</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffe3ef">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{--bg:#ffeaf3;--card:#ffffff;--ink:#3b2a4a;--mute:#8a7a98;--line:#3b2a4a;--pink:#ff7eb3;--lilac:#c9b6ff;--mint:#a8ecd0;--sun:#ffe08a;--soft:#fff5fa;--warn:#d6336c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1f3a;--card:#38294d;--ink:#fbeaf5;--mute:#b9a6cc;--line:#0f0817;--pink:#ff8fbd;--lilac:#8d78d6;--mint:#4fb996;--sun:#e8c15a;--soft:#2f2342;--warn:#ff8fa8;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#2a1f3a;--card:#38294d;--ink:#fbeaf5;--mute:#b9a6cc;--line:#0f0817;--pink:#ff8fbd;--lilac:#8d78d6;--mint:#4fb996;--sun:#e8c15a;--soft:#2f2342;--warn:#ff8fa8;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:700;-webkit-tap-highlight-color:transparent;background-image:radial-gradient(var(--lilac) 1.5px,transparent 1.5px);background-size:22px 22px;background-attachment:fixed}
.wrap{max-width:460px;margin:0 auto;padding:16px 14px 44px}
h1,h2,.fr{font-family:"Fredoka","Nunito",system-ui,sans-serif}
.card{background:var(--card);border:3px solid var(--line);border-radius:24px;box-shadow:0 5px 0 var(--line);padding:16px}
.hero{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.pig{font-size:58px;line-height:1;background:var(--pink);border:3px solid var(--line);border-radius:50%;width:84px;height:84px;display:grid;place-items:center;box-shadow:0 5px 0 var(--line);flex:none;cursor:pointer;user-select:none}
.pig.hop{animation:hop .5s}
@keyframes hop{30%{transform:translateY(-14px) rotate(-8deg)}60%{transform:translateY(0) rotate(6deg)}100%{transform:none}}
.bubble{position:relative;background:var(--sun);border:3px solid var(--line);border-radius:20px;padding:10px 14px;flex:1;font-size:14px;line-height:1.35;color:#3b2a4a}
.bubble:before{content:"";position:absolute;left:-12px;top:50%;margin-top:-8px;border:8px solid transparent;border-right:12px solid var(--line);border-left:0}
.bubble b{display:block;font:700 26px "Fredoka",sans-serif;letter-spacing:-.01em}
.amt{display:flex;align-items:center;gap:8px;background:var(--soft);border:3px solid var(--line);border-radius:18px;padding:6px 14px}
.amt span{font:700 22px "Fredoka",sans-serif;color:var(--pink)}
.amt input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:700 36px "Fredoka",sans-serif;outline:0;padding:2px 0}
.chips{display:flex;gap:7px;margin:12px 0 4px;flex-wrap:wrap}
.chips button{border:2.5px solid var(--line);background:var(--mint);color:#1f3a30;border-radius:999px;padding:6px 12px;font:700 13px "Nunito",sans-serif;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.chips button:active{transform:translateY(3px);box-shadow:none}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:14px 0}
.cat{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px 8px;border:2.5px solid var(--line);background:var(--soft);border-radius:18px;color:var(--ink);font:700 11.5px "Nunito",sans-serif;cursor:pointer}
.cat .ic{font-size:27px;line-height:1.1}
.cat[aria-pressed="true"]{background:var(--lilac);box-shadow:0 4px 0 var(--line);transform:translateY(-3px);color:#2a1a3d}
.note{width:100%;border:2.5px solid var(--line);background:var(--soft);color:var(--ink);border-radius:16px;padding:11px 14px;font:700 15px "Nunito",sans-serif;outline:0}
.note::placeholder,.amt input::placeholder{color:var(--mute);opacity:.7}
.save{width:100%;margin-top:12px;border:3px solid var(--line);border-radius:18px;padding:13px;background:var(--pink);color:#3b0f26;font:700 19px "Fredoka",sans-serif;cursor:pointer;box-shadow:0 5px 0 var(--line)}
.save:active{transform:translateY(5px);box-shadow:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--lilac);outline-offset:2px}
.err{color:var(--warn);font-size:13px;min-height:18px;margin:7px 2px 0}
h2{font-size:19px;margin:24px 4px 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 span{font:700 13px "Nunito",sans-serif;color:var(--mute)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.stat{border:3px solid var(--line);border-radius:18px;padding:9px 6px;text-align:center;box-shadow:0 4px 0 var(--line);color:#3b2a4a}
.stat:nth-child(1){background:var(--mint)}.stat:nth-child(2){background:var(--sun)}.stat:nth-child(3){background:var(--lilac)}
.stat small{display:block;font-size:11px}
.stat b{font:700 16px "Fredoka",sans-serif}
.bars{margin-top:14px;display:grid;gap:8px}
.bar{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;font-size:12px}
.bar i{display:block;height:14px;border:2.5px solid var(--line);border-radius:99px;background:var(--soft);overflow:hidden}
.bar i u{display:block;height:100%;background:var(--pink);text-decoration:none;border-radius:99px;transition:width .4s}
ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
li{display:flex;align-items:center;gap:11px;padding:9px 12px;background:var(--card);border:3px solid var(--line);border-radius:20px}
li .ic{font-size:22px;width:40px;height:40px;display:grid;place-items:center;background:var(--sun);border:2.5px solid var(--line);border-radius:14px;flex:none}
li .mid{flex:1;min-width:0}
li .mid b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
li .mid small{color:var(--mute);font-size:12px}
li .rp{font:700 15px "Fredoka",sans-serif;white-space:nowrap}
li button{border:0;background:transparent;color:var(--mute);font-size:17px;padding:6px;cursor:pointer}
.empty{padding:22px 14px;text-align:center;color:var(--mute);font-size:14px;border:3px dashed var(--mute);border-radius:20px}
.foot{display:flex;justify-content:space-between;margin-top:16px}
.foot button{border:0;background:transparent;color:var(--mute);font:700 13px "Nunito",sans-serif;cursor:pointer;padding:6px 2px;text-decoration:underline}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--soft);border:3px solid var(--line);border-radius:18px;padding:5px;margin-bottom:12px}
.seg button{border:0;border-radius:13px;padding:9px;background:transparent;color:var(--ink);font:700 14px "Fredoka",sans-serif;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pink);color:#3b0f26;box-shadow:0 3px 0 var(--line)}
.seg.in button[aria-pressed="true"]{background:var(--mint);color:#1f3a30}
.stat:nth-child(2){background:var(--pink)}
.mini{margin:12px 2px 0;font-size:13px;color:var(--mute)}.mini:empty{display:none}
li .rp.in{color:#13885a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) li .rp.in{color:#7cf0c0}}
:root[data-theme="dark"] li .rp.in{color:#7cf0c0}
@media (prefers-reduced-motion:reduce){.pig.hop{animation:none}.bar i u{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="pig" id="pig" role="img" aria-label="Maskot kucing">🐱</div>
    <div class="bubble"><span id="msg">Halo!</span><b id="total">Rp0</b><small>saldo hari ini</small></div>
  </div>

  <div class="card">
    <div class="seg out" id="seg"><button id="bOut" aria-pressed="true">Pengeluaran</button><button id="bIn" aria-pressed="false">Pemasukan</button></div>
    <label class="amt"><span>Rp</span><input id="nominal" inputmode="numeric" autocomplete="off" placeholder="0" aria-label="Nominal"></label>
    <div class="chips" id="chips"></div>
    <div class="cats" id="cats"></div>
    <input class="note" id="catatan" maxlength="40" placeholder="Catatan, mis. parkir kampus" aria-label="Catatan">
    <button class="save" id="simpan">Simpan ✨</button>
    <p class="err" id="err" role="alert"></p>
  </div>

  <h2 class="fr">Ringkasan hari ini <span id="tgl"></span></h2>
  <div class="card">
    <div class="stats">
      <div class="stat"><small>Masuk</small><b id="sIn">Rp0</b></div>
      <div class="stat"><small>Keluar</small><b id="sTot">Rp0</b></div>
      <div class="stat"><small>Saldo</small><b id="sSal">Rp0</b></div>
    </div>
    <p class="mini" id="mini"></p><div class="bars" id="bars"></div>
  </div>

  <h2 class="fr">Riwayat <span id="jml"></span></h2>
  <ul id="list"></ul>

  <div class="foot">
    <button id="undo">Batalkan terakhir</button>
    <button id="hapusSemua">Hapus hari ini</button>
  </div>
</div>

<script>
var CATS=[["Makan","🍜"],["Transport","🛵"],["Jajan","🧋"],["Tagihan","🧾"],["Parkir","🅿️"],["Belanja","🛒"],["Pulsa","📱"],["Lainnya","🎀"]];
var INC=[["Uang saku","💌"],["Gaji","💼"],["Hadiah","🎁"],["Lainnya","🎀"]],mode="out";
function C(x){return (x.type==="in"?INC:CATS)[x.cat]}
var KEY="catat-cepat-v1",data=[],cat=0;
try{var raw=localStorage.getItem(KEY);if(raw)data=JSON.parse(raw)||[]}catch(e){data=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
function rp(n){return "Rp"+n.toLocaleString("id-ID")}
function today(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
function $(id){return document.getElementById(id)}
function hop(){var p=$("pig");p.classList.remove("hop");void p.offsetWidth;p.classList.add("hop")}
$("pig").onclick=hop;

var nom=$("nominal");
nom.addEventListener("input",function(){var v=nom.value.replace(/\D/g,"").slice(0,9);nom.value=v?Number(v).toLocaleString("id-ID"):""});
function val(){return Number(nom.value.replace(/\D/g,""))||0}

[2000,5000,10000,20000,50000].forEach(function(n){
  var b=document.createElement("button");b.textContent="+"+(n/1000)+"rb";
  b.onclick=function(){nom.value=(val()+n).toLocaleString("id-ID");nom.focus()};
  $("chips").appendChild(b);
});
function buildCats(){var L=mode==="in"?INC:CATS;cat=0;$("cats").innerHTML="";L.forEach(function(c,i){
  var b=document.createElement("button");b.className="cat";b.setAttribute("aria-pressed",i===0);
  b.innerHTML='<span class="ic">'+c[1]+'</span>'+c[0];
  b.onclick=function(){cat=i;[].forEach.call($("cats").children,function(x,j){x.setAttribute("aria-pressed",j===i)})};
  $("cats").appendChild(b);
});}
buildCats();

function add(){
  var v=val();
  if(!v){$("err").textContent="Isi nominalnya dulu ya.";nom.focus();return}
  $("err").textContent="";
  data.push({id:Date.now(),day:today(),t:Date.now(),amt:v,cat:cat,type:mode,note:$("catatan").value.trim()});
  save();nom.value="";$("catatan").value="";nom.focus();hop();render();
}
function setMode(m){mode=m;$("bOut").setAttribute("aria-pressed",m==="out");$("bIn").setAttribute("aria-pressed",m==="in");$("seg").className="seg "+m;$("simpan").textContent=m==="in"?"Simpan pemasukan ✨":"Simpan ✨";$("catatan").placeholder=m==="in"?"Catatan, mis. uang saku mingguan":"Catatan, mis. parkir kampus";buildCats()}
$("bOut").onclick=function(){setMode("out")};$("bIn").onclick=function(){setMode("in")};
$("simpan").onclick=add;
nom.addEventListener("keydown",function(e){if(e.key==="Enter")add()});
$("catatan").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
$("undo").onclick=function(){var t=today();for(var i=data.length-1;i>=0;i--){if(data[i].day===t){data.splice(i,1);break}}save();render()};
$("hapusSemua").onclick=function(){var t=today();if(data.some(function(x){return x.day===t})&&confirm("Hapus semua catatan hari ini?")){data=data.filter(function(x){return x.day!==t});save();render()}};

function mood(tot,n){
  if(!n)return "Belum ada jajan hari ini, hebat! 🌱";
  if(tot<30000)return "Masih hemat nih, lanjut ya!";
  if(tot<100000)return "Lumayan, tetap dicatat terus ya.";
  return "Wah, hari ini cukup boros! 💸";
}
function render(){
  var t=today(),items=data.filter(function(x){return x.day===t}).reverse();
  var outs=items.filter(function(x){return x.type!=="in"}),ins=items.filter(function(x){return x.type==="in"});
  var tot=outs.reduce(function(s,x){return s+x.amt},0),inc=ins.reduce(function(s,x){return s+x.amt},0),sal=inc-tot;
  $("total").textContent=(sal<0?"-":"")+rp(Math.abs(sal));$("msg").textContent=outs.length?mood(tot,outs.length):(ins.length?"Pemasukan masuk, yeay! 🎉":mood(0,0));
  $("sIn").textContent=rp(inc);$("sTot").textContent=rp(tot);$("sSal").textContent=(sal<0?"-":"")+rp(Math.abs(sal));
  $("tgl").textContent=new Date().toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"short"});
  $("jml").textContent=items.length?items.length+" transaksi":"";
  var per={};outs.forEach(function(x){per[x.cat]=(per[x.cat]||0)+x.amt});
  var keys=Object.keys(per).sort(function(a,b){return per[b]-per[a]});
  $("mini").textContent=keys.length?"Paling banyak keluar untuk "+CATS[keys[0]][1]+" "+CATS[keys[0]][0]:"";
  $("bars").innerHTML=keys.map(function(k){return '<div class="bar"><span>'+CATS[k][1]+'</span><i><u style="width:'+Math.max(6,Math.round(per[k]/tot*100))+'%"></u></i><span>'+rp(per[k])+'</span></div>'}).join("");
  var ul=$("list");ul.innerHTML="";
  if(!items.length){ul.innerHTML='<div class="empty">Belum ada catatan. Ketik nominal lalu tekan Simpan ✨</div>';return}
  items.forEach(function(x){
    var li=document.createElement("li"),d=new Date(x.t);
    var jam=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
    li.innerHTML='<span class="ic">'+C(x)[1]+'</span><div class="mid"><b></b><small>'+jam+'</small></div><span class="rp'+(x.type==="in"?" in":"")+'">'+(x.type==="in"?"+":"-")+rp(x.amt)+'</span><button aria-label="Hapus">✕</button>';
    li.querySelector("b").textContent=x.note||C(x)[0];
    li.querySelector("button").onclick=function(){data=data.filter(function(y){return y.id!==x.id});save();render()};
    ul.appendChild(li);
  });
}
render();
</script>
</body>
</html>
